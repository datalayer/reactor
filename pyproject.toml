[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datalayer-reactor"
version = "0.1.0"
description = "FastAPI + pluggy extension reactor for modular SaaS applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "pluggy>=1.5.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.setuptools]
packages = ["datalayer_reactor", "datalayer_reactor.examples"]
