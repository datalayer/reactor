[build-system]
requires = ["hatchling==1.21.1", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "datalayer_reactor"
dynamic = ["version"]
description = "FastAPI + pluggy extension reactor for modular SaaS applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "pluggy>=1.5.0",
  "pydantic>=2.8.0",
  # The `reactor` command is a Typer application extensions add commands to.
  # A hard dependency rather than an extra: the console script is part of what
  # this package is, and an install that cannot run it is not a working install.
  "typer>=0.12.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
# The interactive REPL (reactor.repl). Soft on purpose: servers never prompt.
repl = [
  "prompt_toolkit>=3.0.0"
]
dev = [
  "pytest>=8.3.0",
  # `reactor commands` is async under the hood, and its tests await the
  # platform directly.
  "pytest-asyncio>=0.24.0",
  # `fastapi.testclient` is a thin wrapper over starlette's, which drives the
  # app through an HTTP client rather than calling it directly — so the client
  # is a test dependency of anything that exercises the management API. It is
  # not pulled in by FastAPI itself, and without it the API test fails at
  # import with a message about a package nobody asked for.
  "httpx>=0.27.0"
]

[project.scripts]
# A Typer application installed extensions extend, whose bare invocation still
# serves. See `reactor.cli`.
reactor = "reactor.cli:main"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.wheel]
packages = ["reactor"]
