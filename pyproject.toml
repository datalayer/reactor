[build-system]
requires = ["hatchling==1.21.1", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "datalayer_reactor"
dynamic = ["version"]
description = "FastAPI + pluggy extension reactor for modular SaaS applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "pluggy>=1.5.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.wheel]
packages = ["reactor"]
