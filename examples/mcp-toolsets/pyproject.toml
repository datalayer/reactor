[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactor-toolsets-example"
version = "0.1.0"
description = "Two example toolsets for reactor_mcp_server: math and geo"
requires-python = ">=3.10"
dependencies = ["reactor_mcp_server>=1.0.4"]

[project.optional-dependencies]
server = ["reactor_mcp_server[server]"]
test = ["pytest>=7", "reactor_mcp_server[test]"]

# Installing this distribution is publishing the two extensions: any
# reactor_mcp_server host scans this group and serves what it finds.
[project.entry-points."reactor.mcp.extensions"]
math = "reactor_toolsets_example.math:extension"
geo = "reactor_toolsets_example.geo:extension"

[tool.hatch.build.targets.wheel]
packages = ["reactor_toolsets_example"]
