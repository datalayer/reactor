[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalayer-cms-astro-core"
version = "0.1.0"
description = "Astro-native SQLite CMS host and Core Reactor extension"
requires-python = ">=3.10"
dependencies = ["datalayer-reactor", "fastapi>=0.115.0", "pydantic>=2.8.0", "uvicorn>=0.30.0"]

[project.entry-points."datalayer.reactor.extensions"]
cms-astro-core = "cms_astro_core:extension"

[project.scripts]
cms-astro = "cms_astro_core:main"
cms-astro-site = "cms_astro_core.site:main"

[tool.hatch.build.targets.wheel]
packages = ["cms_astro_core"]

[tool.hatch.build.targets.wheel.shared-data]
"share/datalayer/reactor/extensions/cms-astro-core" = "share/datalayer/reactor/extensions/cms-astro-core"
"share/datalayer/reactor/apps/cms-astro" = "share/datalayer/reactor/apps/cms-astro"
